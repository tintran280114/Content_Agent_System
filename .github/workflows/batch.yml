name: Scheduled content batch

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic for all configured accounts
        required: false
        default: How small teams can use AI responsibly for social content
  schedule:
    - cron: "17 8,20 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: read

concurrency:
  group: scheduled-content-batch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: llama-3.3-70b-versatile
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
      GITHUB_MODELS_MODEL: openai/gpt-4o-mini
      BATCH_TOPIC: ${{ inputs.topic || 'How small teams can use AI responsibly for social content' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all accounts through the full pipeline
        run: python run.py --all --pipeline full --topic "$BATCH_TOPIC" --database artifacts/content_agent.sqlite3
      - name: Upload SQLite and generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-agent-snapshot-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
